<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trivia FutbolNoEra</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Permanent+Marker&display=swap">
<style>
/* Layout: cancha a rayas de noche en el Maracanã; marcador LED fijo arriba; una "pantalla" por paso, pensada para TV 16:9 */
:root{
  color-scheme: dark;
  --pitch:#0a5c33; --pitch-2:#0d6b3c; --night:#06301c;
  --canary:#ffd21f; --sky:#2a54d6; --shot:#ff3d6e; --chalk:#f4f7ec; --ink:#062417;
  --mid:#ff9a1f;
  --display:"Bungee", "Impact", "Arial Black", sans-serif;
  --body:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --hand:"Permanent Marker", "Comic Sans MS", cursive;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--chalk); font-family:var(--body); font-size:clamp(15px,1.2vw,20px);
  background:
    radial-gradient(ellipse at 50% -10%, rgba(255,255,255,.18), transparent 55%),
    repeating-linear-gradient(90deg, var(--pitch) 0 9vw, var(--pitch-2) 9vw 18vw);
  background-color:var(--pitch);
  background-attachment:fixed;
  overflow-x:hidden;
}
/* líneas de cancha */
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 50% 55%, transparent 17vh, rgba(255,255,255,.13) calc(17vh + 2px), transparent calc(17vh + 5px)),
    linear-gradient(90deg, transparent calc(50% - 2px), rgba(255,255,255,.13) calc(50% - 2px) calc(50% + 2px), transparent calc(50% + 2px));
}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--canary);outline-offset:3px}

/* ---------- MARCADOR ---------- */
.board{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  padding:10px 16px; background:#03140c; border-bottom:4px solid var(--canary);
  box-shadow:0 8px 30px rgba(0,0,0,.5)}
.team{display:flex;align-items:center;gap:12px;min-width:0;padding:6px 10px;border-radius:14px;transition:background .3s}
.team.right{flex-direction:row-reverse;text-align:right}
.team.turn{background:rgba(255,210,31,.14);box-shadow:inset 0 0 0 2px var(--canary)}
.team img{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:50% 20%;border:3px solid var(--canary);flex:none}
.tname{font-family:var(--display);font-size:clamp(16px,1.8vw,30px);letter-spacing:.02em;line-height:1}
.tshots{font-size:.8em;color:#b9cfc2;margin-top:4px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.team.right .tshots{justify-content:flex-end}
.glass{width:12px;height:16px;flex:none}
.score{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:clamp(30px,3.6vw,64px);
  color:#ffe55c;text-shadow:0 0 12px rgba(255,210,31,.75),0 0 2px #fff;min-width:2.2ch;text-align:center;
  background:#000;border-radius:10px;padding:2px 12px;border:2px solid #2a2a2a}
.team.right .score{order:-1}
.team .meta{min-width:0;flex:1}
.mid{text-align:center;font-family:var(--display);font-size:clamp(11px,.9vw,15px);color:var(--canary);line-height:1.25}
.mid b{display:block;color:var(--chalk);font-size:1.5em}
.bump{animation:bump .6s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.45)}100%{transform:scale(1)}}

/* ---------- ESCENARIO ---------- */
main{position:relative;padding-inline:16px;padding-block:24px 90px;min-height:calc(100% - 80px);display:grid;place-items:center}
.screen{width:min(1200px,100%);animation:enter .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes enter{from{transform:translateY(24px) scale(.97);opacity:.4}to{transform:none;opacity:1}}

/* portada */
.home{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,60px);align-items:center}
.crest{width:clamp(200px,30vw,420px);height:auto;filter:drop-shadow(0 12px 30px rgba(0,0,0,.45));animation:spin-in 1s cubic-bezier(.2,.9,.3,1.2)}
@keyframes spin-in{from{transform:rotate(-200deg) scale(.4)}to{transform:none}}
.kicker{font-family:var(--hand);color:var(--canary);font-size:clamp(18px,2vw,32px);transform:rotate(-2deg);display:inline-block}
h1{font-family:var(--display);font-size:clamp(30px,4.6vw,84px);line-height:.88;margin:.1em 0 .15em;text-wrap:balance;
  color:var(--chalk);text-shadow:5px 5px 0 var(--ink), 9px 9px 0 var(--sky)}
h1 span{color:var(--canary)}
h1 em{font-style:normal;color:var(--shot)}
.lead{font-size:clamp(17px,1.5vw,26px);max-width:34ch;line-height:1.4;margin:0 0 1.2em}
.vs{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:1.4em}
.vs .chip{display:flex;align-items:center;gap:10px;background:var(--chalk);color:var(--ink);font-family:var(--display);padding:6px 16px 6px 6px;border-radius:999px;font-size:clamp(16px,1.6vw,26px)}
.vs .chip img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 20%}
.vs i{font-family:var(--hand);font-style:normal;color:var(--canary);font-size:1.6em}

.btn{display:inline-flex;align-items:center;gap:.5em;border:0;border-radius:16px;padding:.7em 1.3em;
  font-family:var(--display);font-size:clamp(16px,1.5vw,26px);color:var(--ink);background:var(--canary);
  box-shadow:0 6px 0 #a88400, 0 12px 24px rgba(0,0,0,.35);transition:transform .08s, box-shadow .08s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a88400}
.btn.ghost{background:transparent;color:var(--chalk);box-shadow:inset 0 0 0 3px rgba(244,247,236,.5)}
.btn.small{font-size:clamp(13px,1vw,17px);padding:.55em 1em;border-radius:12px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* reglas */
.rules{background:var(--chalk);color:var(--ink);border-radius:28px;padding:clamp(20px,3vw,48px);position:relative;
  box-shadow:12px 12px 0 var(--ink)}
.rules h2{font-family:var(--display);font-size:clamp(28px,3.6vw,60px);margin:0 0 .4em;line-height:1;text-wrap:balance}
.rules h2 span{color:var(--sky)}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:10px 0 24px}
.rcard{border-radius:20px;padding:18px;color:var(--ink);min-width:0}
.rcard .big{font-family:var(--display);font-size:clamp(34px,3.6vw,64px);line-height:1}
.rcard .lbl{font-family:var(--display);font-size:clamp(15px,1.3vw,22px);margin:.2em 0 .3em}
.rcard p{margin:0;line-height:1.35}
.c-gol{background:var(--canary)} .c-palo{background:var(--mid)} .c-auto{background:var(--shot);color:#fff}
.c-auto .big,.c-auto .lbl,.c-auto p{color:#fff}
.rlist{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px;margin:0 0 24px;padding:0;list-style:none;font-size:clamp(15px,1.3vw,21px);line-height:1.4}
.rlist li{display:flex;gap:10px;min-width:0}
.rlist li b{font-family:var(--display);color:var(--sky);flex:none}
.stamp-note{position:absolute;top:-22px;right:30px;background:var(--shot);color:#fff;font-family:var(--hand);font-size:clamp(16px,1.6vw,26px);padding:6px 16px;border-radius:8px;transform:rotate(4deg);box-shadow:4px 4px 0 var(--ink)}

/* intro de turno */
.intro{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,64px);align-items:center}
.polaroid{background:#fff;padding:14px 14px 56px;border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.5);transform:rotate(-3deg);position:relative;
  animation:drop .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes drop{from{transform:translateY(-60px) rotate(-14deg);opacity:0}to{transform:rotate(-3deg);opacity:1}}
.polaroid img{display:block;max-height:62vh;max-width:min(40vw,520px);width:auto;height:auto;border-radius:2px}
.polaroid figcaption{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-family:var(--hand);color:var(--ink);font-size:clamp(18px,1.8vw,30px)}
.tape{position:absolute;top:-14px;left:50%;width:120px;height:32px;margin-left:-60px;background:rgba(255,210,31,.75);transform:rotate(3deg)}
.turnlbl{font-family:var(--display);color:var(--canary);font-size:clamp(16px,1.6vw,26px);letter-spacing:.04em}
.who{font-family:var(--display);font-size:clamp(56px,10vw,170px);line-height:.85;margin:.08em 0 .15em;text-shadow:6px 6px 0 var(--ink),11px 11px 0 var(--shot)}
.roast{font-family:var(--hand);font-size:clamp(20px,2.2vw,38px);line-height:1.25;max-width:24ch;margin:0 0 1.2em;color:var(--chalk)}
.qtag{display:inline-block;background:var(--ink);color:var(--canary);font-family:var(--display);padding:.3em .8em;border-radius:10px;margin-bottom:.8em;font-size:clamp(14px,1.2vw,20px)}

/* pregunta */
.qcard{background:var(--chalk);color:var(--ink);border-radius:28px;padding:clamp(22px,3vw,52px);box-shadow:12px 12px 0 var(--ink);position:relative;overflow:hidden}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:.6em}
.qnum{font-family:var(--display);font-size:clamp(16px,1.4vw,24px);color:var(--sky)}
.qwho{display:flex;align-items:center;gap:10px;font-family:var(--display);background:var(--ink);color:var(--canary);border-radius:999px;padding:4px 16px 4px 4px;font-size:clamp(14px,1.2vw,20px)}
.qwho img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 20%}
.qtext{font-family:var(--body);font-weight:800;font-size:clamp(26px,3.6vw,62px);line-height:1.08;margin:.2em 0 .7em;text-wrap:balance;letter-spacing:-.01em}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.gbtn{border:0;border-radius:20px;padding:16px 12px;color:var(--ink);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 7px 0 rgba(0,0,0,.35);transition:transform .08s, box-shadow .08s, opacity .2s}
.gbtn:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.gbtn .g1{font-family:var(--display);font-size:clamp(24px,2.6vw,46px);line-height:1}
.gbtn .g2{font-weight:800;font-size:clamp(14px,1.2vw,20px)}
.gbtn kbd{font-family:var(--body);font-size:.75em;opacity:.7;border:1.5px solid currentColor;border-radius:6px;padding:0 6px;margin-top:4px}
.gbtn.ok{background:var(--canary)} .gbtn.half{background:var(--mid)} .gbtn.bad{background:var(--shot);color:#fff}
.grade.done .gbtn{opacity:.4} .grade.done .gbtn.sel{opacity:1;box-shadow:0 0 0 5px var(--ink),0 7px 0 rgba(0,0,0,.35)}
.answer{margin-top:22px;border-top:3px dashed rgba(6,36,23,.25);padding-top:16px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.answer .ans{flex:1;min-width:0;font-size:clamp(16px,1.4vw,24px);line-height:1.4}
.answer .ans b{font-family:var(--display);color:var(--sky);font-weight:400}
.answer .crit{font-size:.85em;color:#3b5a4a;margin-top:.3em}
.qnav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}

/* sello */
.stamp{position:absolute;right:4%;bottom:14%;font-family:var(--display);font-size:clamp(46px,7vw,130px);line-height:.9;padding:.1em .3em;border:.08em solid currentColor;border-radius:.15em;
  transform:rotate(-12deg);pointer-events:none;mix-blend-mode:multiply;animation:stamp .45s cubic-bezier(.2,1.4,.4,1);text-align:center}
.stamp small{display:block;font-size:.32em}
.stamp.ok{color:#c79c00} .stamp.half{color:#d16a00} .stamp.bad{color:#e0143f}
@keyframes stamp{from{transform:rotate(-12deg) scale(3);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.92}}

/* overlay shot */
.shotfx{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(255,61,110,.92);color:#fff;text-align:center;animation:fade 1.9s ease forwards;pointer-events:none}
.shotfx .t{font-family:var(--display);font-size:clamp(70px,16vw,280px);line-height:.85;text-shadow:8px 8px 0 var(--ink)}
.shotfx .s{font-family:var(--hand);font-size:clamp(22px,3vw,52px)}
@keyframes fade{0%{opacity:0;transform:scale(1.3)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}

/* final */
.final{text-align:center}
.final h2{font-family:var(--display);font-size:clamp(40px,6vw,110px);margin:0;line-height:.9;text-shadow:5px 5px 0 var(--ink),9px 9px 0 var(--sky)}
.podium{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,70px);margin:30px auto;max-width:1000px;align-items:end}
.pcol{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.pcol .polaroid{transform:rotate(3deg);animation:none}
.pcol.lose .polaroid{transform:rotate(-4deg)}
.pcol .polaroid img{max-height:44vh;max-width:100%}
.pcol .badge{font-family:var(--display);font-size:clamp(22px,2.6vw,44px);padding:.2em .7em;border-radius:14px}
.win .badge{background:var(--canary);color:var(--ink)} .lose .badge{background:var(--shot);color:#fff}
.pcol .pts{font-family:var(--display);font-size:clamp(18px,1.8vw,30px)}
.verdict{font-family:var(--hand);font-size:clamp(22px,2.6vw,44px);max-width:30ch;margin:0 auto 24px;line-height:1.2}
.tbl{overflow-x:auto;margin:10px auto 26px;max-width:1000px}
.tbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;background:rgba(3,20,12,.7);border-radius:16px;overflow:hidden}
.tbl th,.tbl td{padding:8px 10px;text-align:center;border-bottom:1px solid rgba(255,255,255,.1)}
.tbl th{font-family:var(--display);color:var(--canary);font-weight:400}
.dot{display:inline-block;min-width:2.2em;border-radius:8px;padding:2px 6px;font-weight:800}
.dot.ok{background:var(--canary);color:var(--ink)} .dot.half{background:var(--mid);color:var(--ink)} .dot.bad{background:var(--shot);color:#fff} .dot.none{background:rgba(255,255,255,.12)}

/* barra inferior */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(3,20,12,.85);backdrop-filter:blur(6px);font-size:13px;color:#b9cfc2}
.dock .keys kbd{border:1px solid #6f8c7c;border-radius:5px;padding:0 5px;margin:0 2px;color:var(--chalk)}
.dock .row{gap:8px}
.dock button{background:transparent;color:var(--chalk);border:1.5px solid #476a58;border-radius:10px;padding:5px 10px;font-size:13px}
.dock button:hover{border-color:var(--canary)}
.progress{position:fixed;left:0;bottom:0;height:4px;background:var(--canary);z-index:16;transition:width .4s}
.confirm{display:flex;gap:8px;align-items:center}

@media (max-width:820px){
  .home,.intro{grid-template-columns:1fr;justify-items:center;text-align:center}
  .vs,.home .row{justify-content:center}
  .rgrid{grid-template-columns:1fr}
  .rlist{grid-template-columns:1fr}
  .grade{grid-template-columns:1fr}
  .polaroid img{max-width:100%;max-height:50vh}
  .roast{margin-inline:auto}
  .team img{width:38px;height:38px}
  .mid{display:none}
  .board{grid-template-columns:1fr 1fr}
  .stamp{top:auto;bottom:14%}
  .dock .keys{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<header class="board" id="board" aria-label="Marcador">
  <div class="team" id="t-loncho">
    <img src="img/loncho_1.jpg" alt="Loncho">
    <div class="meta"><div class="tname">LONCHO</div><div class="tshots" id="s-loncho"></div></div>
    <div class="score" id="p-loncho">0</div>
  </div>
  <div class="mid" id="midlbl">RÍO 2026<b>VS</b>DESPEDIDA</div>
  <div class="team right" id="t-lalein">
    <img src="img/lalein_1.jpg" alt="Lalein">
    <div class="meta"><div class="tname">LALEIN</div><div class="tshots" id="s-lalein"></div></div>
    <div class="score" id="p-lalein">0</div>
  </div>
</header>

<main id="stage"></main>

<div class="progress" id="prog"></div>
<footer class="dock">
  <div class="keys"><kbd>→</kbd> siguiente · <kbd>←</kbd> atrás · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> calificar · <kbd>R</kbd> respuesta · <kbd>F</kbd> pantalla completa</div>
  <div class="row">
    <button id="b-home" type="button">Inicio</button>
    <button id="b-sound" type="button">Sonido: sí</button>
    <button id="b-full" type="button">Pantalla completa</button>
    <span class="confirm" id="resetbox"><button id="b-reset" type="button">Reiniciar partido</button></span>
  </div>
</footer>

<script>
const PLAYERS = {
  loncho:{name:"Loncho"},
  lalein:{name:"Lalein"}
};

// Impares → Loncho, pares → Lalein. Foto = número de turno de cada uno.
const Q = [
 {q:"¿Cada cuántos años se juega el Mundial?",
  a:"Cada <b>4 años</b>.", c:"Sin medias tintas: o es 4 o es shot."},
 {q:"¿Qué equipo chileno ganó la Libertadores y qué equipo chileno ganó la Sudamericana? ¿En qué años?",
  a:"<b>Colo-Colo</b> ganó la Libertadores en <b>1991</b>. <b>Universidad de Chile</b> ganó la Sudamericana en <b>2011</b>.", c:"+1 si acierta los equipos pero no los años, o solo uno de los dos."},
 {q:"Si un equipo gana un partido, ¿cuántos puntos suma? ¿Si empata? ¿Si pierde?",
  a:"Gana <b>3</b>, empata <b>1</b>, pierde <b>0</b>.", c:"+1 si acierta dos de las tres."},
 {q:"¿Cuántos cambios tiene un equipo en los 90 minutos?",
  a:"<b>5 cambios</b>, en máximo 3 ventanas (más el entretiempo).", c:"Respuesta exacta: 5. Si dice 3 (la regla antigua), el jurado decide si da +1."},
 {q:"¿Quién es el 9 del Manchester City?",
  a:"<b>Erling Haaland</b>.", c:"+1 si dice \"el noruego\" o algo parecido a Haaland."},
 {q:"¿Cuántos mundiales ha ganado Argentina?",
  a:"<b>3</b>: 1978, 1986 y 2022. (En 2026 perdió la final con España.)", c:"Número exacto o shot."},
 {q:"¿Cuántos Balones de Oro tiene Messi?",
  a:"<b>8</b> (2009, 2010, 2011, 2012, 2015, 2019, 2021, 2023).", c:"+1 si dice 7 o 9."},
 {q:"¿Cómo se llama el equipo donde juega Cristiano Ronaldo?",
  a:"<b>Al Nassr</b> (Arabia Saudita).", c:"+1 si dice \"uno de Arabia\" sin el nombre."},
 {q:"Nombra 5 estadios de fútbol de Chile.",
  a:"Ej.: <b>Nacional, Monumental, Santa Laura, San Carlos de Apoquindo, Sausalito, El Teniente, Ester Roa, Elías Figueroa, Germán Becker, Bicentenario de La Florida, Calvo y Bascuñán, Zorros del Desierto, Francisco Sánchez Rumoroso, Nelson Oyarzún</b>.", c:"5 = +3 · 3 o 4 = +1 · menos de 3 = shot."},
 {q:"¿Cómo se llama el técnico del Real Madrid?",
  a:"<b>José Mourinho</b> (volvió en junio de 2026, reemplazando a Arbeloa).", c:"+1 si dice Arbeloa o Xabi Alonso (estuvieron esta misma temporada pasada)."},
 {q:"¿Cómo se llama el técnico de Argentina?",
  a:"<b>Lionel Scaloni</b>.", c:"+1 si dice solo \"Lionel\" sin confundirlo con Messi."},
 {q:"¿Cuántas competiciones continentales europeas de clubes hay por temporada?",
  a:"<b>3</b>: Champions League, Europa League y Conference League. <b>+ la Supercopa de Europa</b>.", c:"+1 si nombra 1 o 2, o dice el número sin nombrarlas."},
 {q:"Si un defensa le da un pase con el pie al arquero y este toma el balón con las manos, ¿qué sucede?",
  a:"<b>Tiro libre indirecto</b> para el rival, desde donde el arquero tomó el balón.", c:"+1 si dice \"falta\" o \"cobran algo\" sin decir indirecto."},
 {q:"¿En qué parte de la cancha comienza a haber offside?",
  a:"En la <b>mitad de la cancha del rival</b>. En tu propio campo no hay offside.", c:"+1 si dice \"cerca del arco rival\" o \"en el área\"."},
 {q:"¿Quién es el máximo goleador de la historia de los Mundiales?",
  a:"<b>Kylian Mbappé</b>: 22 goles tras el Mundial 2026, superó a Messi (21) y a Klose (16).", c:"+1 si dice Messi o Klose (fueron récord hasta 2026)."},
 {q:"¿Quién es el máximo goleador de la selección brasileña?",
  a:"<b>Neymar</b>, con 80 goles (se despidió de Brasil tras el Mundial 2026).", c:"+1 si dice Pelé (77)."},
 {q:"¿Cuántos mundiales ha ganado Brasil?",

function totals(){
  const t = {loncho:{pts:0,shots:0,done:0}, lalein:{pts:0,shots:0,done:0}};
  S.res.forEach((r,i)=>{ if(!r) return; const p=t[who(i)]; p.pts+=GRADES[r].pts; p.done++; if(r==="bad") p.shots++; });
  return t;
}
const glass = `<svg class="glass" viewBox="0 0 12 16" aria-hidden="true"><path d="M1 1h10l-1.5 14h-7z" fill="#ff3d6e" stroke="#fff" stroke-width="1"/></svg>`;
let last = null;
function renderBoard(){
  const t = totals();
  ["loncho","lalein"].forEach(k=>{
    const el = document.getElementById("p-"+k);
    if(last && last[k].pts !== t[k].pts){ el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
    el.textContent = t[k].pts;
    document.getElementById("s-"+k).innerHTML = t[k].shots ? `${glass.repeat(t[k].shots)} <span>${t[k].shots} shot${t[k].shots>1?"s":""}</span>` : `<span>0 shots · ${t[k].done}/10</span>`;
    document.getElementById("t-"+k).classList.toggle("turn", (S.view==="intro"||S.view==="q") && who(S.i)===k);
  });
  const mid = document.getElementById("midlbl");
  mid.innerHTML = (S.view==="intro"||S.view==="q") ? `PREGUNTA<b>${S.i+1}/20</b>RÍO 2026` : `RÍO 2026<b>VS</b>DESPEDIDA`;
  last = t;
  const pct = S.view==="home"?0 : S.view==="rules"?2 : S.view==="final"?100 : ((S.i*2 + (S.view==="q"?1:0) + 1)/40)*100;

}

function viewFinal(){

  const tie = L.pts===A.pts;

    S.res.forEach((r,i)=>{ if(who(i)===k) cells.push(`<td><span class="dot ${r||"none"}">${r?GRADES[r].pts:"–"}</span></td>`); });
    return `<tr><th>${PLAYERS[k].name}</th>${cells.join("")}<td><b>${t[k].pts}</b></td><td>${t[k].shots}</td></tr>`;
  }).join("");
  const col = (k, cls, badge) => `<div class="pcol ${cls}">

function next(){
  if(S.view==="home") S.view="rules";
  else if(S.view==="rules"){ S.view="intro"; S.i=0; }
  else if(S.view==="intro"){ S.view="q"; S.ans=false; }
  else if(S.view==="q"){ if(!S.res[S.i]) return; if(S.i===19) S.view="final"; else { S.i++; S.view="intro"; } }
  render();
}
function back(){
  if(S.view==="rules") S.view="home";
  else if(S.view==="intro"){ if(S.i===0) S.view="rules"; else { S.i--; S.view="q"; } }
  else if(S.view==="q") S.view="intro";
  else if(S.view==="final"){ S.i=19; S.view="q"; }
  S.ans=false; render();
}
function grade(g){
  if(S.view!=="q") return;
  const prev = S.res[S.i];
  S.res[S.i] = g; render();
  if(g!==prev) fx(g);
}

/* sonido: silbato de árbitro y bocina, generados en vivo */
let ac;
function tone(freqs, dur, type="square", vol=.08, trill=0){
  if(!sound) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const t0 = ac.currentTime;
    freqs.forEach((f,j)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type; o.frequency.setValueAtTime(f,t0+j*dur);
      if(trill){ const l=ac.createOscillator(), lg=ac.createGain(); l.frequency.value=trill; lg.gain.value=60; l.connect(lg).connect(o.frequency); l.start(t0+j*dur); l.stop(t0+(j+1)*dur); }
      g.gain.setValueAtTime(0,t0+j*dur); g.gain.linearRampToValueAtTime(vol,t0+j*dur+.02); g.gain.linearRampToValueAtTime(0,t0+(j+1)*dur);
      o.connect(g).connect(ac.destination); o.start(t0+j*dur); o.stop(t0+(j+1)*dur+.02);
    });
  }catch(e){}
}
function fx(g){
  if(g==="ok") tone([523,659,784,1047],.13,"square",.06);
  if(g==="half") tone([440,330],.2,"triangle",.12);
  if(g==="bad"){
    tone([2600,2600,2600],.28,"sine",.09,28);
    const name = PLAYERS[who(S.i)].name.toUpperCase();
    const d=document.createElement("div"); d.className="shotfx";
    d.innerHTML=`<div><div class="t">¡SHOT!</div><div class="s">${name}, al seco. Sin hacer caras.</div></div>`;
    document.body.appendChild(d); setTimeout(()=>d.remove(),1950);
  }
}

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-go],[data-grade]"); if(!b) return;
  if(b.dataset.grade) return grade(b.dataset.grade);
  const go=b.dataset.go;
  if(go==="rules"){ S.view="rules"; render(); }
  else if(go==="home"){ S.view="home"; render(); }
  else if(go==="start"){ S.view="intro"; S.i=0; render(); }
  else if(go==="resume"){ S.i=firstPending(); S.view="intro"; render(); }
  else if(go==="q"||go==="next") next();
  else if(go==="back") back();
  else if(go==="ans"){ S.ans=!S.ans; render(); }
});
document.addEventListener("keydown", e=>{
  if(e.target.closest("input,textarea")) return;
  const k=e.key.toLowerCase();
  if(k==="arrowright"||k==="enter"&&!e.target.closest("button")||k===" "&&!e.target.closest("button")){ e.preventDefault(); next(); }
  else if(k==="arrowleft"){ back(); }
  else if(k==="1") grade("ok"); else if(k==="2") grade("half"); else if(k==="3") grade("bad");
  else if(k==="r" && S.view==="q"){ S.ans=!S.ans; render(); }
  else if(k==="f") full();
});
function full(){ try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} }

document.getElementById("b-home").onclick = ()=>{ S.view="home"; render(); };
document.getElementById("b-sound").onclick = e=>{ sound=!sound; e.target.textContent="Sonido: "+(sound?"sí":"no"); };
document.getElementById("b-reset").onclick = ()=>{

  document.getElementById("r-no").onclick=resetBtn;
};
const resetHandler = document.getElementById("b-reset").onclick;
function resetBtn(){ const box=document.getElementById("resetbox"); box.innerHTML=`<button id="b-reset" type="button">Reiniciar partido</button>`; document.getElementById("b-reset").onclick=resetHandler; }
